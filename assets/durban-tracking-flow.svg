<svg xmlns="http://www.w3.org/2000/svg" width="560" height="590" viewBox="0 0 560 590"><rect width="560" height="590" fill="#eef3e7"/><g font-family="Arial,sans-serif"><text x="45" y="50" font-size="25" fill="#182d28">DurbanFix / Follow progress</text><text x="45" y="79" font-size="13" fill="#53645d">Resident and staff workflow</text><rect x="45" y="125" width="470" height="78" rx="13" fill="white" stroke="#ccd9c3"/><text x="65" y="154" font-size="17" fill="#182d28">01 / Track by reference</text><text x="65" y="178" font-size="13" fill="#53645d">Look up the submitted report</text><path d="M280 204v22" stroke="#74966a" stroke-width="2"/><rect x="45" y="227" width="470" height="78" rx="13" fill="white" stroke="#ccd9c3"/><text x="65" y="256" font-size="17" fill="#182d28">02 / Review the status</text><text x="65" y="280" font-size="13" fill="#53645d">See the current stage of the issue</text><path d="M280 306v22" stroke="#74966a" stroke-width="2"/><rect x="45" y="329" width="470" height="78" rx="13" fill="white" stroke="#ccd9c3"/><text x="65" y="358" font-size="17" fill="#182d28">03 / Staff manage reports</text><text x="65" y="382" font-size="13" fill="#53645d">Triage, assign and update reports</text><path d="M280 408v22" stroke="#74966a" stroke-width="2"/><rect x="45" y="431" width="470" height="78" rx="13" fill="white" stroke="#ccd9c3"/><text x="65" y="460" font-size="17" fill="#182d28">04 / Receive updates</text><text x="65" y="484" font-size="13" fill="#53645d">Optional SMS notifications</text><text x="45" y="565" font-size="11" fill="#53645d">Portfolio workflow diagram / not an application screenshot</text></g></svg>